<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | MDB ARTHASPHERE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    
    .auth-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header img {
      height: 48px;
      margin-bottom: 24px;
    }
    
    .auth-header h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--text-muted);
      font-size: 15px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    
    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }
    
    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 12px;
      border-radius: 10px;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }
    
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
    
    .error-msg {
      color: #ef4444;
      background: rgba(239,68,68,0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    
    .success-msg {
      color: #10b981;
      background: rgba(16,185,129,0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html">
          <img src="images/logo.png" alt="MDB Arthasphere">
        </a>
        <h1>Create an Account</h1>
        <p>Invest in India's top unlisted & pre-IPO shares.</p>
      </div>
      
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>
      
      <form id="signupForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="As per PAN Card" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        </div>
        
        <div class="form-group">
          <label for="panNumber">PAN Card Number</label>
          <input type="text" id="panNumber" class="form-control" placeholder="ABCDE1234F" style="text-transform: uppercase;" required maxlength="10">
          <small style="display:block; margin-top:6px; color:var(--text-muted); font-size:11px;">Your PAN is securely verified to comply with regulations.</small>
        </div>
        
        <button type="submit" class="btn btn-primary btn-submit" id="submitBtn">Verify & Sign Up</button>
      </form>
      
      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying PAN...';

      const data = {
        full_name: document.getElementById('fullName').value,
        phone: document.getElementById('phone').value,
        pan_number: document.getElementById('panNumber').value.toUpperCase()
      };
      
      // Basic local PAN regex validation
      const panRegex = /^[A-Z]{5}[0-9]{4}[A-Z]{1}$/;
      if (!panRegex.test(data.pan_number)) {
        errorBox.textContent = 'Invalid PAN format. Example: ABCDE1234F';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify & Sign Up';
        return;
      }

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          successBox.textContent = 'Account verified and created successfully! Redirecting to login...';
          successBox.style.display = 'block';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          errorBox.textContent = result.detail || 'Registration failed.';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Verify & Sign Up';
        }
      } catch (err) {
        errorBox.textContent = 'Server error. Please try again later.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify & Sign Up';
      }
    });
  </script>
</body>
</html>
