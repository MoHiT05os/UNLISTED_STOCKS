<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MDB ARTHASPHERE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }
    
    .auth-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header img {
      height: 48px;
      margin-bottom: 24px;
    }
    
    .auth-header h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    
    .auth-header p {
      color: var(--text-muted);
      font-size: 15px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    
    .form-control {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.05);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }
    
    .btn-submit {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      margin-top: 12px;
      border-radius: 10px;
    }
    
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }
    
    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .auth-footer a:hover {
      text-decoration: underline;
    }
    
    .error-msg {
      color: #ef4444;
      background: rgba(239,68,68,0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    
    .success-msg {
      color: #10b981;
      background: rgba(16,185,129,0.1);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    #otpStep {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html">
          <img src="images/logo.png" alt="MDB Arthasphere">
        </a>
        <h1>Welcome Back</h1>
        <p>Login with your registered phone number.</p>
      </div>
      
      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>
      
      <!-- STEP 1: Phone Input -->
      <form id="loginForm">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        </div>
        <button type="submit" class="btn btn-primary btn-submit" id="sendOtpBtn">Get OTP</button>
      </form>

      <!-- STEP 2: OTP Input -->
      <form id="otpStep">
        <div class="form-group">
          <label for="otp">Enter 6-digit OTP</label>
          <input type="text" id="otp" class="form-control" placeholder="Enter OTP (Hint: 123456 for testing)" pattern="[0-9]{6}" required>
          <small style="display:block; margin-top:6px; color:var(--text-muted); font-size:11px;">(Check the backend server console for the mock OTP)</small>
        </div>
        <button type="submit" class="btn btn-primary btn-submit" id="verifyBtn">Verify & Login</button>
      </form>
      
      <div class="auth-footer" id="authFooter">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const otpStep = document.getElementById('otpStep');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyBtn = document.getElementById('verifyBtn');
    const authFooter = document.getElementById('authFooter');

    let currentPhone = '';

    // Step 1: Request OTP
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      sendOtpBtn.disabled = true;
      sendOtpBtn.textContent = 'Sending...';

      currentPhone = document.getElementById('phone').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone })
        });

        const result = await response.json();

        if (response.ok) {
          successBox.textContent = 'OTP sent to your phone! (Check server console)';
          successBox.style.display = 'block';
          
          loginForm.style.display = 'none';
          authFooter.style.display = 'none';
          otpStep.style.display = 'block';
        } else {
          errorBox.textContent = result.detail || 'Login failed.';
          errorBox.style.display = 'block';
          sendOtpBtn.disabled = false;
          sendOtpBtn.textContent = 'Get OTP';
        }
      } catch (err) {
        errorBox.textContent = 'Server error. Is the backend running?';
        errorBox.style.display = 'block';
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Get OTP';
      }
    });

    // Step 2: Verify OTP
    otpStep.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';

      const otp = document.getElementById('otp').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: currentPhone, otp: otp })
        });

        const result = await response.json();

        if (response.ok) {
          successBox.textContent = 'Login successful! Redirecting to Screener...';
          successBox.style.display = 'block';
          
          // Store token and redirect
          localStorage.setItem('auth_token', result.token);
          localStorage.setItem('user_name', result.user.name);
          localStorage.setItem('user_phone', result.user.phone);
          if (result.user.pan_number) {
            localStorage.setItem('user_pan', result.user.pan_number);
          }
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          errorBox.textContent = result.detail || 'Invalid OTP.';
          errorBox.style.display = 'block';
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify & Login';
        }
      } catch (err) {
        errorBox.textContent = 'Server error.';
        errorBox.style.display = 'block';
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Login';
      }
    });
  </script>
</body>
</html>
